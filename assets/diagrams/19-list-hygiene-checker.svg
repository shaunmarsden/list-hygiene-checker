<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-labelledby="title"><title id="title">Five outcomes from a list hygiene check</title><style>:root{--i:#183b56;--l:#607080;--g:#e8f5ed;--a:#fff4dd;--n:#eef2f6}@media(prefers-color-scheme:dark){:root{--i:#e6edf3;--l:#9baabd;--g:#183b2a;--a:#4a3610;--n:#263444}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--i)}.x{stroke:var(--l);stroke-width:3;rx:16}.t{font-size:17px;font-weight:700}.s{font-size:13px}</style><rect class="x" x="15" y="55" width="160" height="110" fill="var(--a)"/><rect class="x" x="190" y="55" width="160" height="110" fill="var(--a)"/><rect class="x" x="365" y="55" width="160" height="110" fill="var(--n)"/><rect class="x" x="540" y="55" width="160" height="110" fill="var(--a)"/><rect class="x" x="715" y="55" width="150" height="110" fill="var(--g)"/><text class="t" x="95" y="91" text-anchor="middle">Confident</text><text class="t" x="95" y="112" text-anchor="middle">duplicate</text><text class="s" x="95" y="139" text-anchor="middle">Multiple shared IDs</text><text class="t" x="270" y="91" text-anchor="middle">Possible</text><text class="t" x="270" y="112" text-anchor="middle">duplicate</text><text class="s" x="270" y="139" text-anchor="middle">Human check needed</text><text class="t" x="445" y="91" text-anchor="middle">Not a real</text><text class="t" x="445" y="112" text-anchor="middle">record</text><text class="s" x="445" y="139" text-anchor="middle">Test or placeholder</text><text class="t" x="620" y="102" text-anchor="middle">Stale record</text><text class="s" x="620" y="139" text-anchor="middle">No movement for too long</text><text class="t" x="790" y="102" text-anchor="middle">Clean record</text><text class="s" x="790" y="139" text-anchor="middle">No manufactured issue</text></svg>
